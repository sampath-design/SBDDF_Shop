<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Shop Referral & Secure Partner Portal</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const translations = {
      si: {
        appTitle: "සාප්පු හවුල්කාර හා කොමිස් කළමනාකරණ පද්ධතිය",
        adminLoginTitle: "ප්‍රධාන සාප්පු පරිපාලක පිවිසුම (Admin Login)",
        partnerLoginTitle: "හවුල්කාර සාප්පු පිවිසුම (Partner Portal Login)",
        username: "පරිශීලක නාමය (Username)",
        password: "මුරපදය (Password)",
        loginBtn: "පද්ධතියට පිවිසෙන්න (Login)",
        logoutBtn: "ඉවත් වන්න (Logout)",
        loginError: "වැරදි පරිශීලක නාමයක් හෝ මුරපදයකි!",
        dashboardTab: "ඩෑෂ්බෝඩ් (Dashboard)",
        addJobTab: "නව ජොබ් එකක් එක් කරන්න",
        categoriesTab: "වර්ගීකරණය (Categories)",
        catalogTab: "සේවා සහ භාණ්ඩ",
        shopsTab: "හවුල්කාර සාප්පු",
        settlementsTab: "ගෙවීම් නිරවුල් කිරීම්",
        historyTab: "ගනුදෙනු වාර්තා (Job History)",
        adminOwedTotal: "හවුල්කරුවන්ට ගෙවීමට ඇති මුළු කොමිස්",
        adminNetProfit: "මගේ ශුද්ධ ලාභය (Admin Net Profit)",
        totalJobsRecorded: "ලියාපදිංචි මුළු ජොබ් ගණන",
        partnerEarnedTotal: "ඔබට ලැබීමට ඇති මුළු කොමිස් මුදල",
        partnerCompletedJobs: "සාර්ථකව නිම කළ ජොබ්",
        partnerSettlementTotal: "දැනට ලබාගත් මුළු කොමිස් මුදල",
        addNewsShop: "නව හවුල්කාර සාප්පුවක් ලියාපදිංචි කරන්න",
        shopName: "සාප්පුවේ නම",
        contactPerson: "සම්බන්ධීකාරක නම",
        phone: "දුරකථන අංකය",
        defaultCommRate: "පෙරනිමි කොමිස් %",
        saveShopBtn: "සාප්පුව ලියාපදිංචි කර Login Passwords ලබාදෙන්න",
        generatedCredentials: "සාදන ලද පිවිසුම් විස්තර (Login Credentials):",
        copyCreds: "විස්තර කොපි කරන්න",
        partnerAddJobTitle: "ඔබේ සාප්පුවෙන් පාරිභෝගිකයෙකු යොමු කරන්න (Add Referral Job)",
        customerName: "පාරිභෝගිකයාගේ නම",
        jobDesc: "කාර්යයේ විස්තරය",
        totalCharged: "පාරිභෝගිකයාගෙන් අය කළ මුදල (Rs.)",
        saveJobBtn: "ජොබ් එක යොමු කරන්න",
        actions: "ක්‍රියාමාර්ග",
        custBill: "පාරිභෝගික ගාස්තුව:",
        partnerCommLabel: "කොමිස් මුදල:",
        myProfitLabel: "ශුද්ධ ලාභය:"
      }
    };

    const initialCategories = [
      { id: 'cat_1', name: 'Mobile Repair', description: 'Display replacement' },
      { id: 'cat_2', name: 'Computer & Laptop', description: 'Motherboard repair' }
    ];

    const initialShops = [
      { id: 'shop_1', name: 'Apex Electronics', contactPerson: 'Kamal', phone: '0771112233', defaultCommRate: 10, username: 'apex123', password: 'pw_apex_99' },
      { id: 'shop_2', name: 'Micro Tech', contactPerson: 'Sunil', phone: '0714445566', defaultCommRate: 15, username: 'micro456', password: 'pw_micro_88' }
    ];

    const initialTransactions = [
      { id: 'tx_1', shopId: 'shop_1', customerName: 'Nimal Jayasinghe', phone: '0779876543', description: 'Display Replacement', totalCharged: 15000, myCost: 8000, payoutToOther: 1500, jobStatus: 'COMPLETED', isSettled: false, date: '2026-10-25' }
    ];

    function App() {
      const [lang, setLang] = useState('si');
      const t = translations[lang];

      const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('app_categories')) || initialCategories);
      const [shops, setShops] = useState(() => JSON.parse(localStorage.getItem('app_shops')) || initialShops);
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('app_transactions')) || initialTransactions);
      const [settlements, setSettlements] = useState(() => JSON.parse(localStorage.getItem('app_settlements')) || []);

      // Auth state: role can be 'GUEST_ADMIN', 'GUEST_PARTNER', 'ADMIN', or 'PARTNER'
      const [authRole, setAuthRole] = useState('GUEST_ADMIN'); // Default start login screen
      const [loggedInShopId, setLoggedInShopId] = useState(null);

      // Login form inputs
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');

      // New Shop Form with auto password generator
      const [newShop, setNewShop] = useState({ name: '', contactPerson: '', phone: '', defaultCommRate: 10 });
      const [lastCreatedCreds, setLastCreatedCreds] = useState(null);

      // Partner/Admin Add Job Form
      const [jobForm, setJobForm] = useState({
        customerName: '',
        phone: '',
        description: '',
        totalCharged: '',
        myCost: 0,
        commRate: 10
      });

      useEffect(() => { localStorage.setItem('app_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('app_shops', JSON.stringify(shops)); }, [shops]);
      useEffect(() => { localStorage.setItem('app_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('app_settlements', JSON.stringify(settlements)); }, [settlements]);

      // Admin Login Handler
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (loginUser === 'admin' && loginPass === 'admin123') {
          setAuthRole('ADMIN');
          setLoginError('');
          setLoginUser('');
          setLoginPass('');
        } else {
          setLoginError(t.loginError);
        }
      };

      // Partner Login Handler
      const handlePartnerLogin = (e) => {
        e.preventDefault();
        const foundShop = shops.find(s => s.username === loginUser && s.password === loginPass);
        if (foundShop) {
          setAuthRole('PARTNER');
          setLoggedInShopId(foundShop.id);
          setLoginError('');
          setLoginUser('');
          setLoginPass('');
        } else {
          setLoginError(t.loginError);
        }
      };

      // Auto Generate Shop with Username & Password
      const handleAddShopWithCreds = (e) => {
        e.preventDefault();
        if (!newShop.name.trim()) return;
        const shopId = 'shop_' + Date.now();
        const username = newShop.name.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6) + Math.floor(100 + Math.random() * 900);
        const password = 'pw_' + Math.random().toString(36.slice(-6));

        const createdShop = {
          id: shopId,
          ...newShop,
          defaultCommRate: parseFloat(newShop.defaultCommRate) || 10,
          username,
          password
        };

        setShops([...shops, createdShop]);
        setLastCreatedCreds(createdShop);
        setNewShop({ name: '', contactPerson: '', phone: '', defaultCommRate: 10 });
      };

      // Add Job Handler (Admin can pick shop, Partner auto uses their shopId)
      const handleAddJobSubmit = (e) => {
        e.preventDefault();
        const targetShopId = authRole === 'ADMIN' ? jobForm.shopId || shops[0]?.id : loggedInShopId;
        const shopObj = shops.find(s => s.id === targetShopId);
        const commRate = shopObj ? shopObj.defaultCommRate : 10;
        const total = parseFloat(jobForm.totalCharged) || 0;
        const payout = Math.round((total * commRate) / 100);

        const newTx = {
          id: 'tx_' + Date.now(),
          shopId: targetShopId,
          customerName: jobForm.customerName,
          phone: jobForm.phone,
          description: jobForm.description,
          totalCharged: total,
          myCost: parseFloat(jobForm.myCost) || 0,
          payoutToOther: payout,
          jobStatus: 'COMPLETED',
          isSettled: false,
          date: new Date().toISOString().split('T')[0]
        };

        setTransactions([newTx, ...transactions]);
        setJobForm({ customerName: '', phone: '', description: '', totalCharged: '', myCost: 0, commRate: 10 });
        setActiveTab('dashboard');
      };

      // Filtered transactions based on role
      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          if (authRole === 'PARTNER' && tx.shopId !== loggedInShopId) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return tx.customerName.toLowerCase().includes(q) || tx.description.toLowerCase().includes(q);
        });
      }, [transactions, authRole, loggedInShopId, searchQuery]);

      // Metrics
      const totalAdminOwed = useMemo(() => transactions.filter(t => !t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0), [transactions]);
      const totalAdminNetProfit = useMemo(() => transactions.reduce((sum, t) => sum + (t.totalCharged - t.myCost - t.payoutToOther), 0), [transactions]);

      const partnerMetrics = useMemo(() => {
        const partnerTxs = transactions.filter(t => t.shopId === loggedInShopId);
        const pendingPayout = partnerTxs.filter(t => !t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0);
        const settledPayout = partnerTxs.filter(t => t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0);
        const completedCount = partnerTxs.filter(t => t.jobStatus === 'COMPLETED').length;
        return { pendingPayout, settledPayout, completedCount, totalCount: partnerTxs.length };
      }, [transactions, loggedInShopId]);

      // --- LOGIN SCREENS IF NOT LOGGED IN ---
      if (authRole === 'GUEST_ADMIN' || authRole === 'GUEST_PARTNER') {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full">
              <h1 className="text-xl font-extrabold text-slate-900 text-center mb-2">🏪 {t.appTitle}</h1>
              <div className="flex justify-center gap-2 mb-6">
                <button onClick={() => { setAuthRole('GUEST_ADMIN'); setLoginError(''); }} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${authRole === 'GUEST_ADMIN' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}`}>Admin Login</button>
                <button onClick={() => { setAuthRole('GUEST_PARTNER'); setLoginError(''); }} className={`px-4 py-1.5 rounded-lg text-xs font-bold ${authRole === 'GUEST_PARTNER' ? 'bg-amber-600 text-white' : 'bg-gray-100 text-gray-600'}`}>Partner Login</button>
              </div>

              {loginError && <div className="bg-red-50 border border-red-200 text-red-600 text-xs p-3 rounded-lg mb-4 text-center">{loginError}</div>}

              {authRole === 'GUEST_ADMIN' ? (
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <h3 className="text-sm font-bold text-gray-700">{t.adminLoginTitle}</h3>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">{t.username} (admin)</label>
                    <input type="text" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">{t.password} (admin123)</label>
                    <input type="password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm" required />
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow">{t.loginBtn}</button>
                </form>
              ) : (
                <form onSubmit={handlePartnerLogin} className="space-y-4">
                  <h3 className="text-sm font-bold text-gray-700">{t.partnerLoginTitle}</h3>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">{t.username}</label>
                    <input type="text" value={loginUser} onChange={(e) => setLoginUser(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm" placeholder="e.g. apex123" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-600 mb-1">{t.password}</label>
                    <input type="password" value={loginPass} onChange={(e) => setLoginPass(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm" required />
                  </div>
                  <button type="submit" className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-xl text-sm shadow">{t.loginBtn}</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // --- MAIN APPLICATION INTERFACE (ADMIN OR PARTNER) ---
      const activePartnerObj = shops.find(s => s.id === loggedInShopId);

      return (
        <div className="min-h-screen pb-12">
          <header className="bg-slate-900 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold">🏪 {t.appTitle}</h1>
                <p className="text-slate-400 text-xs mt-0.5">
                  {authRole === 'ADMIN' ? '👑 Admin Master Control' : `🤝 Partner Shop Portal: ${activePartnerObj?.name}`}
                </p>
              </div>
              <button onClick={() => { setAuthRole('GUEST_ADMIN'); }} className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold">
                🚪 {t.logoutBtn}
              </button>
            </div>
          </header>

          <div className="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 flex gap-2 py-2">
              <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-lg font-medium text-sm ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>📊 {t.dashboardTab}</button>
              <button onClick={() => setActiveTab('addJob')} className={`px-4 py-2 rounded-lg font-medium text-sm ${activeTab === 'addJob' ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>➕ {t.addJobTab}</button>
              {authRole === 'ADMIN' && (
                <>
                  <button onClick={() => setActiveTab('shops')} className={`px-4 py-2 rounded-lg font-medium text-sm ${activeTab === 'shops' ? 'bg-indigo-600 text-white' : 'text-gray-600 hover:bg-gray-100'}`}>🏬 {t.shopsTab}</button>
                </>
              )}
            </div>
          </div>

          <main className="max-w-7xl mx-auto px-4 py-6">
            <div className="mb-6 bg-white p-4 rounded-xl border shadow-sm">
              <input type="text" placeholder="Search customer or job..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full md:w-96 border rounded-lg px-3 py-2 text-sm" />
            </div>

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div>
                {authRole === 'ADMIN' ? (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div className="bg-white p-6 rounded-xl border-l-4 border-amber-500 shadow-sm">
                      <p className="text-xs font-semibold text-gray-500 uppercase">{t.adminOwedTotal}</p>
                      <h3 className="text-3xl font-extrabold text-amber-600 mt-2">Rs. {totalAdminOwed.toLocaleString()}</h3>
                    </div>
                    <div className="bg-white p-6 rounded-xl border-l-4 border-emerald-500 shadow-sm">
                      <p className="text-xs font-semibold text-gray-500 uppercase">{t.adminNetProfit}</p>
                      <h3 className="text-3xl font-extrabold text-emerald-600 mt-2">Rs. {totalAdminNetProfit.toLocaleString()}</h3>
                    </div>
                    <div className="bg-white p-6 rounded-xl border-l-4 border-indigo-500 shadow-sm">
                      <p className="text-xs font-semibold text-gray-500 uppercase">{t.totalJobsRecorded}</p>
                      <h3 className="text-3xl font-extrabold text-indigo-600 mt-2">{transactions.length}</h3>
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div className="bg-white p-6 rounded-xl border-l-4 border-amber-500 shadow-sm">
                      <p className="text-xs font-semibold text-gray-500 uppercase">{t.partnerEarnedTotal}</p>
                      <h3 className="text-3xl font-extrabold text-amber-600 mt-2">Rs. {partnerMetrics.pendingPayout.toLocaleString()}</h3>
                    </div>
                    <div className="bg-white p-6 rounded-xl border-l-4 border-emerald-500 shadow-sm">
                      <p className="text-xs font-semibold text-gray-500 uppercase">{t.partnerSettlementTotal}</p>
                      <h3 className="text-3xl font-extrabold text-emerald-600 mt-2">Rs. {partnerMetrics.settledPayout.toLocaleString()}</h3>
                    </div>
                    <div className="bg-white p-6 rounded-xl border-l-4 border-blue-500 shadow-sm">
                      <p className="text-xs font-semibold text-gray-500 uppercase">{t.partnerCompletedJobs}</p>
                      <h3 className="text-3xl font-extrabold text-blue-600 mt-2">{partnerMetrics.completedCount}</h3>
                    </div>
                  </div>
                )}

                <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <div className="p-4 border-b bg-gray-50 font-bold text-gray-700">📋 {t.historyTab}</div>
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-100 text-slate-600 uppercase text-xs">
                      <tr>
                        <th className="p-3">Date</th>
                        {authRole === 'ADMIN' && <th className="p-3">Shop Name</th>}
                        <th className="p-3">Customer & Description</th>
                        <th className="p-3">Bill & Commission</th>
                        <th className="p-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {filteredTransactions.map(tx => {
                        const shop = shops.find(s => s.id === tx.shopId);
                        return (
                          <tr key={tx.id} className="hover:bg-gray-50">
                            <td className="p-3 text-xs text-gray-500">{tx.date}</td>
                            {authRole === 'ADMIN' && <td className="p-3 font-semibold text-gray-800">{shop?.name}</td>}
                            <td className="p-3">
                              <div className="font-bold">{tx.customerName}</div>
                              <div className="text-xs text-gray-500">📞 {tx.phone}</div>
                              <div className="text-xs text-slate-700">{tx.description}</div>
                            </td>
                            <td className="p-3 text-xs">
                              <div>{t.custBill} <strong>Rs. {tx.totalCharged.toLocaleString()}</strong></div>
                              <div className="text-amber-700 font-bold">{t.partnerCommLabel} Rs. {tx.payoutToOther.toLocaleString()}</div>
                            </td>
                            <td className="p-3">
                              <span className={`px-2 py-1 rounded text-xs font-bold ${tx.isSettled ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}`}>
                                {tx.isSettled ? 'Settled' : 'Pending Payout'}
                              </span>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* ADD JOB */}
            {activeTab === 'addJob' && (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-sm border">
                <h2 className="text-xl font-bold mb-4 text-gray-800 border-b pb-2">➕ {t.addJobTab}</h2>
                <form onSubmit={handleAddJobSubmit} className="space-y-4">
                  {authRole === 'ADMIN' && (
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">Select Partner Shop</label>
                      <select value={jobForm.shopId || ''} onChange={(e) => setJobForm({...jobForm, shopId: e.target.value})} className="w-full border rounded-lg p-2 text-sm" required>
                        {shops.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">{t.customerName}</label>
                    <input type="text" required value={jobForm.customerName} onChange={(e) => setJobForm({...jobForm, customerName: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">{t.phone}</label>
                    <input type="text" value={jobForm.phone} onChange={(e) => setJobForm({...jobForm, phone: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">{t.jobDesc}</label>
                    <input type="text" required value={jobForm.description} onChange={(e) => setJobForm({...jobForm, description: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">{t.totalCharged}</label>
                    <input type="number" required value={jobForm.totalCharged} onChange={(e) => setJobForm({...jobForm, totalCharged: e.target.value})} className="w-full border rounded-lg p-2 text-sm font-bold" />
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg text-sm shadow">💾 {t.saveJobBtn}</button>
                </form>
              </div>
            )}

            {/* SHOPS MANAGEMENT (ADMIN ONLY WITH AUTO-CREDENTIALS) */}
            {activeTab === 'shops' && authRole === 'ADMIN' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border">
                  <h3 className="font-bold mb-4 text-gray-800">🏬 {t.addNewsShop}</h3>
                  <form onSubmit={handleAddShopWithCreds} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.shopName}</label>
                      <input type="text" required value={newShop.name} onChange={(e) => setNewShop({...newShop, name: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.contactPerson}</label>
                      <input type="text" value={newShop.contactPerson} onChange={(e) => setNewShop({...newShop, contactPerson: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.phone}</label>
                      <input type="text" value={newShop.phone} onChange={(e) => setNewShop({...newShop, phone: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.defaultCommRate}</label>
                      <input type="number" value={newShop.defaultCommRate} onChange={(e) => setNewShop({...newShop, defaultCommRate: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm">💾 {t.saveShopBtn}</button>
                  </form>

                  {lastCreatedCreds && (
                    <div className="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-xs space-y-1">
                      <div className="font-bold text-amber-900">{t.generatedCredentials}</div>
                      <div>Username: <strong>{lastCreatedCreds.username}</strong></div>
                      <div>Password: <strong>{lastCreatedCreds.password}</strong></div>
                    </div>
                  )}
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border">
                  <h3 className="font-bold mb-4 text-gray-800">🤝 Registered Partner Accounts</h3>
                  <div className="space-y-3">
                    {shops.map(s => (
                      <div key={s.id} className="p-3 border rounded-lg bg-slate-50 flex justify-between items-center text-xs">
                        <div>
                          <div className="font-bold text-slate-800 text-sm">{s.name}</div>
                          <div className="text-gray-500">User: <code className="bg-gray-200 px-1 rounded">{s.username}</code> | Pass: <code className="bg-gray-200 px-1 rounded">{s.password}</code></div>
                        </div>
                        <div className="text-amber-700 font-bold">Comm: {s.defaultCommRate}%</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
