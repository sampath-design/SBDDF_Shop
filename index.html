        confirmDeleteShop: "මෙම සාප්පු ප්‍රොෆයිලය ඉවත් කිරීමට ඔබ විශ්වාසද?",

        partnerCommLabel: "හවුල්කරුගේ කොමිස් මුදල:",

    const initialCategories = [
      { id: 'cat_1', name: 'Mobile Repair', description: 'Display replacement, IC repair' },
      { id: 'cat_2', name: 'Computer & Laptop', description: 'Motherboard repair, format' },
      { id: 'cat_3', name: 'Graphic & Printing', description: 'Banner printing, design' }
    ];

    const initialShops = [
      { id: 'shop_1', name: 'Apex Electronics (Kamal)', contactPerson: 'Kamal Perera', phone: '0771112233', defaultCommRate: 10 },
      { id: 'shop_2', name: 'Micro Tech Solutions (Sunil)', contactPerson: 'Sunil Shantha', phone: '0714445566', defaultCommRate: 15 }
    ];

    const initialCatalog = [
      { id: 'item_1', shopId: 'shop_1', categoryId: 'cat_1', name: 'Samsung Display Replacement', basePrice: 15000, defaultCommRate: 12 },
      { id: 'item_2', shopId: 'shop_2', categoryId: 'cat_3', name: 'Vinyl Banner Printing', basePrice: 3500, defaultCommRate: 15 }
    ];

    const initialTransactions = [
      { id: 'tx_1', shopId: 'shop_1', categoryId: 'cat_1', itemId: 'item_1', type: 'INBOUND', customerName: 'Nimal Jayasinghe', phone: '0779876543', description: 'Samsung Display Replacement', totalCharged: 15000, myCost: 8000, payoutToOther: 1800, jobStatus: 'COMPLETED', isSettled: false, date: '2026-10-25', notes: 'Apex referred' },
      { id: 'tx_2', shopId: 'shop_2', categoryId: 'cat_3', itemId: 'item_2', type: 'INBOUND', customerName: 'Saman Kumara', phone: '0751239876', description: 'Vinyl Banner Printing', totalCharged: 14000, myCost: 5000, payoutToOther: 2100, jobStatus: 'COMPLETED', isSettled: true, date: '2026-10-26', notes: 'Micro Tech referred' }
    ];

    function App() {
      const [lang, setLang] = useState('si');
      const t = translations[lang];

      const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('app_categories')) || initialCategories);
      const [shops, setShops] = useState(() => JSON.parse(localStorage.getItem('app_shops')) || initialShops);
      const [catalogItems, setCatalogItems] = useState(() => JSON.parse(localStorage.getItem('app_catalog_items')) || initialCatalog);
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('app_transactions')) || initialTransactions);
      const [settlements, setSettlements] = useState(() => JSON.parse(localStorage.getItem('app_settlements')) || []);

      const [currentRole, setActiveRole] = useState('ADMIN'); // 'ADMIN' or 'PARTNER'
      const [activePartnerId, setActivePartnerId] = useState(shops[0]?.id || '');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [copiedLink, setCopiedLink] = useState(false);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const urlShopId = params.get('shopId');
        if (urlShopId) {
          const found = shops.find(s => s.id === urlShopId);
          if (found) {
            setActivePartnerId(urlShopId);
            setActiveRole('PARTNER');
          }
        }
      }, []);

      useEffect(() => { localStorage.setItem('app_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('app_shops', JSON.stringify(shops)); }, [shops]);
      useEffect(() => { localStorage.setItem('app_catalog_items', JSON.stringify(catalogItems)); }, [catalogItems]);
      useEffect(() => { localStorage.setItem('app_transactions', JSON.stringify(transactions)); }, [transactions]);
      useEffect(() => { localStorage.setItem('app_settlements', JSON.stringify(settlements)); }, [settlements]);

      const [newCat, setNewCat] = useState({ name: '', description: '' });
      const [newShop, setNewShop] = useState({ name: '', contactPerson: '', phone: '', defaultCommRate: 10 });
      const [newCatalog, setNewCatalog] = useState({ shopId: shops[0]?.id || '', categoryId: '', name: '', basePrice: '', defaultCommRate: 10 });
      
      const [jobForm, setJobForm] = useState({
        shopId: shops[0]?.id || '',
        categoryId: '',
        itemId: '',
        type: 'INBOUND',
        customerName: '',
        phone: '',
        description: '',
        totalCharged: '',
        myCost: '',
        commType: 'PERCENT',
        commValue: 10,
        payoutToOther: 0,
        jobStatus: 'PENDING',
        date: new Date().toISOString().split('T')[0],
        notes: ''
      });

      const [settleAmount, setSettleAmount] = useState('');

      const handleCatalogSelect = (itemId) => {
        if (!itemId) return;
        const selected = catalogItems.find(c => c.id === itemId);
        if (selected) {
          setJobForm(prev => {
            const total = selected.basePrice;
            const comm = Math.round((total * selected.defaultCommRate) / 100);
            return {
              ...prev,
              itemId: selected.id,
              categoryId: selected.categoryId,
              description: selected.name,
              totalCharged: total,
              commType: 'PERCENT',
              commValue: selected.defaultCommRate,
              payoutToOther: comm
            };
          });
        }
      };

      useEffect(() => {
        const total = parseFloat(jobForm.totalCharged) || 0;
        let calculated = 0;
        if (jobForm.commType === 'PERCENT') {
          calculated = Math.round((total * (parseFloat(jobForm.commValue) || 0)) / 100);
        } else {
          calculated = parseFloat(jobForm.commValue) || 0;
        }
        setJobForm(prev => ({ ...prev, payoutToOther: calculated }));
      }, [jobForm.totalCharged, jobForm.commType, jobForm.commValue]);

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCat.name.trim()) return;
        setCategories([...categories, { id: 'cat_' + Date.now(), ...newCat }]);
        setNewCat({ name: '', description: '' });
      };

      const handleAddShop = (e) => {
        e.preventDefault();
        if (!newShop.name.trim()) return;
        setShops([...shops, { id: 'shop_' + Date.now(), ...newShop, defaultCommRate: parseFloat(newShop.defaultCommRate) || 10 }]);
        setNewShop({ name: '', contactPerson: '', phone: '', defaultCommRate: 10 });
      };

      const handleAddCatalogItem = (e) => {
        e.preventDefault();
        if (!newCatalog.name.trim() || !newCatalog.shopId) return;
        setCatalogItems([...catalogItems, {
          id: 'item_' + Date.now(),
          ...newCatalog,
          basePrice: parseFloat(newCatalog.basePrice) || 0,
          defaultCommRate: parseFloat(newCatalog.defaultCommRate) || 10
        }]);
        setNewCatalog(prev => ({ ...prev, name: '', basePrice: '' }));
      };

      const handleAddJob = (e) => {
        e.preventDefault();
        if (!jobForm.shopId || !jobForm.customerName.trim()) return;
        const newTx = {
          id: 'tx_' + Date.now(),
          ...jobForm,
          totalCharged: parseFloat(jobForm.totalCharged) || 0,
          myCost: parseFloat(jobForm.myCost) || 0,
          payoutToOther: parseFloat(jobForm.payoutToOther) || 0,
          isSettled: false
        };
        setTransactions([newTx, ...transactions]);
        setJobForm({
          shopId: shops[0]?.id || '',
          categoryId: '',
          itemId: '',
          type: 'INBOUND',
          customerName: '',
          phone: '',
          description: '',
          totalCharged: '',
          myCost: '',
          commType: 'PERCENT',
          commValue: 10,
          payoutToOther: 0,
          jobStatus: 'PENDING',
          date: new Date().toISOString().split('T')[0],
          notes: ''
        });
        setActiveTab('dashboard');
      };

      const handleSettlePayout = (shopId) => {
        const amount = parseFloat(settleAmount);
        if (!amount || amount <= 0) return;

        const settlementRecord = {
          id: 'set_' + Date.now(),
          shopId,
          amount,
          date: new Date().toISOString().split('T')[0],
          notes: 'Cash/Bank Transfer'
        };

        let remaining = amount;
        const updatedTxs = transactions.map(tx => {
          if (tx.shopId === shopId && !tx.isSettled) {
            if (tx.payoutToOther <= remaining) {
              remaining -= tx.payoutToOther;
              return { ...tx, isSettled: true };
            }
          }
          return tx;
        });

        setSettlements([settlementRecord, ...settlements]);
        setTransactions(updatedTxs);
        setSettleAmount('');
      };

      // STRICT PRIVACY FILTER: Partner can ONLY see their own shop's referrals/data!
      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          if (currentRole === 'PARTNER' && tx.shopId !== activePartnerId) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return (
            tx.customerName.toLowerCase().includes(q) ||
            tx.description.toLowerCase().includes(q) ||
            tx.phone.includes(q)
          );
        });
      }, [transactions, currentRole, activePartnerId, searchQuery]);

      const totalAdminOwed = useMemo(() => transactions.filter(t => !t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0), [transactions]);
      const totalAdminNetProfit = useMemo(() => transactions.reduce((sum, t) => sum + (t.totalCharged - t.myCost - t.payoutToOther), 0), [transactions]);

      const activePartnerObj = useMemo(() => shops.find(s => s.id === activePartnerId), [shops, activePartnerId]);

      const partnerMetrics = useMemo(() => {

                                </td>
                              )}
                            </tr>
                          );

            {/* ADD JOB TAB (ADMIN) */}

                      <select

                        className="w-full border rounded-lg p-2 text-sm"

                        {shops.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}

                        <option value="">{t.customJobOption}</option>

                      <input type="text" value={jobForm.phone} onChange={(e) => setJobForm({ ...jobForm, phone: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />

                  </div>

                  <div>

                    <input type="text" required value={jobForm.description} onChange={(e) => setJobForm({ ...jobForm, description: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.totalCharged}</label>
                      <input type="number" required value={jobForm.totalCharged} onChange={(e) => setJobForm({ ...jobForm, totalCharged: e.target.value })} className="w-full border rounded-lg p-2 text-sm font-bold text-slate-800" />

                        <div key={item.id} className="p-3 border rounded-lg flex justify-between items-center hover:bg-gray-50">
                          <div>
                            <span className="text-xs bg-gray-200 px-2 py-0.5 rounded text-gray-700 mr-2">{shop?.name}</span>
                            {cat && <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">{cat.name}</span>}
                            <h4 className="font-bold text-slate-800 text-sm mt-1">{item.name}</h4>
                          </div>
                          <div className="text-right">
                            <div className="font-bold text-emerald-600 text-sm">Rs. {item.basePrice.toLocaleString()}</div>
                            <div className="text-xs text-amber-600">Comm: {item.defaultCommRate}%</div>
                            <button onClick={() => setCatalogItems(catalogItems.filter(i => i.id !== item.id))} className="text-red-400 hover:text-red-600 text-xs mt-1">🗑️ Delete</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* SHOPS TAB */}
            {activeTab === 'shops' && currentRole === 'ADMIN' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                  <h3 className="font-bold mb-4 text-gray-800">🏬 {t.addNewsShop}</h3>
                  <form onSubmit={handleAddShop} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.shopName}</label>
                      <input type="text" required value={newShop.name} onChange={(e) => setNewShop({ ...newShop, name: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.contactPerson}</label>
                      <input type="text" value={newShop.contactPerson} onChange={(e) => setNewShop({ ...newShop, contactPerson: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.phone}</label>
                      <input type="text" value={newShop.phone} onChange={(e) => setNewShop({ ...newShop, phone: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.defaultCommRate}</label>
                      <input type="number" value={newShop.defaultCommRate} onChange={(e) => setNewShop({ ...newShop, defaultCommRate: e.target.value })} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-sm">💾 {t.saveShopBtn}</button>
                  </form>
                </div>
                <div className="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                  <h3 className="font-bold mb-4 text-gray-800">🤝 Registered Partner Profiles</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {shops.map(s => (
                      <div key={s.id} className="p-4 border rounded-xl bg-slate-50 relative">
                        <button onClick={() => setShops(shops.filter(x => x.id !== s.id))} className="absolute top-3 right-3 text-red-400 hover:text-red-600 text-xs">✕</button>
                        <h4 className="font-bold text-slate-800">{s.name}</h4>
                        <div className="text-xs text-gray-500 mt-1">👤 {s.contactPerson}</div>
                        <div className="text-xs text-gray-500">📞 {s.phone}</div>
                        <div className="text-xs font-bold text-amber-700 mt-2">Default Rate: {s.defaultCommRate}%</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* SETTLEMENTS TAB */}
            {activeTab === 'settlements' && currentRole === 'ADMIN' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                  <h3 className="font-bold mb-4 text-gray-800">💳 {t.recordSettlementPayout}</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.selectPartnerShop}</label>
                      <select value={activePartnerId} onChange={(e) => setActivePartnerId(e.target.value)} className="w-full border rounded-lg p-2 text-sm">
                        {shops.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.payoutAmountInput}</label>
                      <input type="number" placeholder="0.00" value={settleAmount} onChange={(e) => setSettleAmount(e.target.value)} className="w-full border rounded-lg p-2 text-sm font-bold text-emerald-700" />
                    </div>
                    <button onClick={() => handleSettlePayout(activePartnerId)} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm">✅ {t.settleBtn}</button>
                  </div>
                </div>
                <div className="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                  <h3 className="font-bold mb-4 text-gray-800">🧾 Settlement Payout History Log</h3>
                  <div className="space-y-3">
                    {settlements.map(set => {
                      const shop = shops.find(s => s.id === set.shopId);
                      return (
                        <div key={set.id} className="p-3 border rounded-lg bg-emerald-50 border-emerald-200 flex justify-between items-center">
                          <div>
                            <h4 className="font-bold text-slate-800 text-sm">{shop?.name}</h4>
                            <div className="text-xs text-gray-500">{set.date} • {set.notes}</div>
                          </div>
                          <div className="text-lg font-extrabold text-emerald-700">Rs. {set.amount.toLocaleString()}</div>
                        </div>
                      );
                    })}
                    {settlements.length === 0 && <p className="text-gray-400 text-xs">No settlements recorded yet.</p>}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
