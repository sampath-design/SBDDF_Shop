      },
      en: {
        appTitle: "Cross-Shop Referral & Commission System",
        appSubTitle: "Advanced Management & Partner Portal",

        customerName: "Customer Name",
        jobDesc: "Job Description",
        totalCharged: "Customer Bill (Rs.)",
        saveJobBtn: "Submit Job Referral",
        actions: "Actions",
        custBill: "Customer Price:",
        partnerCommLabel: "Commission Payout:",

        searchPlaceholder: "Search customer, service or phone..."

    const initialCategories = [
      { id: 'cat_1', name: 'Mobile Repair', description: 'Phone hardware & software fixes' },
      { id: 'cat_2', name: 'Computer & Laptop', description: 'Laptop & PC maintenance' }
    ];

    const initialSubCategories = [
      { id: 'sub_1', categoryId: 'cat_1', name: 'Display & Touch' },
      { id: 'sub_2', categoryId: 'cat_1', name: 'Battery & Charging' },
      { id: 'sub_3', categoryId: 'cat_2', name: 'Motherboard Repair' }
    ];

    const initialShops = [
      { id: 'shop_1', name: 'Apex Electronics', contactPerson: 'Kamal', phone: '0771112233', defaultCommRate: 10, username: 'apex123', password: 'pw_apex_99' },
      { id: 'shop_2', name: 'Micro Tech', contactPerson: 'Sunil', phone: '0714445566', defaultCommRate: 15, username: 'micro456', password: 'pw_micro_88' }
    ];

    const initialCatalog = [
      { id: 'item_1', shopId: 'shop_1', categoryId: 'cat_1', subCategoryId: 'sub_1', name: 'Samsung Original Display Replacement', basePrice: 15000, commType: 'PERCENT', commValue: 12, payoutAmount: 1800 },
      { id: 'item_2', shopId: 'shop_2', categoryId: 'cat_2', subCategoryId: 'sub_3', name: 'Laptop Chip Level Motherboard Repair', basePrice: 12000, commType: 'FIXED', commValue: 1500, payoutAmount: 1500 }
    ];

    const initialTransactions = [
      { id: 'tx_1', shopId: 'shop_1', customerName: 'Nimal Jayasinghe', phone: '0779876543', description: 'Samsung Original Display Replacement', totalCharged: 15000, myCost: 8000, payoutToOther: 1800, jobStatus: 'COMPLETED', isSettled: false, date: '2026-10-25' }
    ];

    function App() {
      const [lang, setLang] = useState('si');
      const t = translations[lang];

      const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('app_categories')) || initialCategories);
      const [subCategories, setSubCategories] = useState(() => JSON.parse(localStorage.getItem('app_sub_categories')) || initialSubCategories);
      const [shops, setShops] = useState(() => JSON.parse(localStorage.getItem('app_shops')) || initialShops);
      const [catalogItems, setCatalogItems] = useState(() => JSON.parse(localStorage.getItem('app_catalog_items')) || initialCatalog);
      const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('app_transactions')) || initialTransactions);
      
      const [authRole, setAuthRole] = useState('GUEST_ADMIN');
      const [loggedInShopId, setLoggedInShopId] = useState(null);

      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');

      const [newCat, setNewCat] = useState({ name: '', description: '' });
      const [newSubCat, setNewSubCat] = useState({ categoryId: categories[0]?.id || '', name: '' });
      const [newShop, setNewShop] = useState({ name: '', contactPerson: '', phone: '', defaultCommRate: 10 });

      const [newCatalog, setNewCatalog] = useState({
        shopId: shops[0]?.id || '',
        categoryId: categories[0]?.id || '',
        subCategoryId: '',
        name: '',
        basePrice: '',
        commType: 'PERCENT',
        commValue: 10,
        payoutAmount: 0
      });

      const [selectedCategory, setSelectedCategory] = useState('');
      const [selectedSubCategory, setSelectedSubCategory] = useState('');

      // Job form state including custom commission configuration support
      const [jobForm, setJobForm] = useState({
        shopId: shops[0]?.id || '',
        itemId: '',
        customerName: '',
        phone: '',
        description: '',
        totalCharged: '',
        myCost: 0,
        commType: 'PERCENT',
        commValue: 10,
        payoutAmount: 0
      });

      useEffect(() => { localStorage.setItem('app_categories', JSON.stringify(categories)); }, [categories]);
      useEffect(() => { localStorage.setItem('app_sub_categories', JSON.stringify(subCategories)); }, [subCategories]);
      useEffect(() => { localStorage.setItem('app_shops', JSON.stringify(shops)); }, [shops]);
      useEffect(() => { localStorage.setItem('app_catalog_items', JSON.stringify(catalogItems)); }, [catalogItems]);
      useEffect(() => { localStorage.setItem('app_transactions', JSON.stringify(transactions)); }, [transactions]);

      // Catalog commission calculation
      useEffect(() => {
        const price = parseFloat(newCatalog.basePrice) || 0;
        const val = parseFloat(newCatalog.commValue) || 0;
        let calculated = 0;
        if (newCatalog.commType === 'PERCENT') {
          calculated = Math.round((price * val) / 100);
        } else {
          calculated = val;
        }
        setNewCatalog(prev => ({ ...prev, payoutAmount: calculated }));
      }, [newCatalog.basePrice, newCatalog.commType, newCatalog.commValue]);

      // Job form commission calculation (when custom item / manual entry)
      useEffect(() => {
        const price = parseFloat(jobForm.totalCharged) || 0;
        const val = parseFloat(jobForm.commValue) || 0;
        let calculated = 0;
        if (jobForm.commType === 'PERCENT') {
          calculated = Math.round((price * val) / 100);
        } else {
          calculated = val;
        }
        setJobForm(prev => ({ ...prev, payoutAmount: calculated }));
      }, [jobForm.totalCharged, jobForm.commType, jobForm.commValue]);

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (loginUser === 'admin' && loginPass === 'admin123') {
          setAuthRole('ADMIN');
          setLoginError('');
          setLoginUser('');
          setLoginPass('');
        } else {
          setLoginError(t.loginError);
        }
      };

      const handlePartnerLogin = (e) => {
        e.preventDefault();
        const foundShop = shops.find(s => s.username === loginUser && s.password === loginPass);
        if (foundShop) {
          setAuthRole('PARTNER');
          setLoggedInShopId(foundShop.id);
          setLoginError('');
          setLoginUser('');
          setLoginPass('');
        } else {
          setLoginError(t.loginError);
        }
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCat.name.trim()) return;
        setCategories([...categories, { id: 'cat_' + Date.now(), ...newCat }]);
        setNewCat({ name: '', description: '' });
      };

      const handleAddSubCategory = (e) => {
        e.preventDefault();
        if (!newSubCat.name.trim() || !newSubCat.categoryId) return;
        setSubCategories([...subCategories, { id: 'sub_' + Date.now(), ...newSubCat }]);
        setNewSubCat({ categoryId: categories[0]?.id || '', name: '' });
      };

      const handleAddShop = (e) => {
        e.preventDefault();
        if (!newShop.name.trim()) return;
        const shopId = 'shop_' + Date.now();
        const username = newShop.name.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6) + Math.floor(100 + Math.random() * 900);
        const password = 'pw_' + Math.random().toString(36).substring(2, 8);

        const createdShop = {
          id: shopId,
          ...newShop,
          defaultCommRate: parseFloat(newShop.defaultCommRate) || 10,
          username,
          password
        };

        setShops([...shops, createdShop]);
        setNewShop({ name: '', contactPerson: '', phone: '', defaultCommRate: 10 });
      };

      const handleAddCatalogItem = (e) => {
        e.preventDefault();
        if (!newCatalog.name.trim() || !newCatalog.shopId) return;
        setCatalogItems([...catalogItems, {
          id: 'item_' + Date.now(),
          ...newCatalog,
          basePrice: parseFloat(newCatalog.basePrice) || 0,
          payoutAmount: parseFloat(newCatalog.payoutAmount) || 0
        }]);
        setNewCatalog({
          shopId: authRole === 'PARTNER' ? loggedInShopId : (shops[0]?.id || ''),
          categoryId: categories[0]?.id || '',
          subCategoryId: '',
          name: '',
          basePrice: '',
          commType: 'PERCENT',
          commValue: 10,
          payoutAmount: 0
        });
      };

      const handleCatalogSelect = (itemId) => {
        if (!itemId) {
          setJobForm(prev => ({ ...prev, itemId: '', description: '', totalCharged: '', payoutAmount: 0 }));
          return;
        }
        const selected = catalogItems.find(c => c.id === itemId);
        if (selected) {
          setJobForm(prev => ({
            ...prev,
            itemId: selected.id,
            description: selected.name,
            totalCharged: selected.basePrice,
            commType: selected.commType || 'PERCENT',
            commValue: selected.commValue || 10,
            payoutAmount: selected.payoutAmount || 0
          }));
        }
      };

      const handleAddJobSubmit = (e) => {
        e.preventDefault();
        const targetShopId = authRole === 'ADMIN' ? jobForm.shopId || shops[0]?.id : loggedInShopId;
        const selectedItem = catalogItems.find(i => i.id === jobForm.itemId);
        
        let finalPayout = 0;
        const total = parseFloat(jobForm.totalCharged) || 0;
        if (selectedItem) {
          finalPayout = selectedItem.payoutAmount;
        } else {
          finalPayout = jobForm.payoutAmount;
        }

        const newTx = {
          id: 'tx_' + Date.now(),
          shopId: targetShopId,
          customerName: jobForm.customerName,
          phone: jobForm.phone,
          description: jobForm.description,
          totalCharged: total,
          myCost: parseFloat(jobForm.myCost) || 0,
          payoutToOther: finalPayout,
          jobStatus: 'COMPLETED',
          isSettled: false,
          date: new Date().toISOString().split('T')[0]
        };

        setTransactions([newTx, ...transactions]);
        setJobForm({
          shopId: shops[0]?.id || '',
          itemId: '',
          customerName: '',
          phone: '',
          description: '',
          totalCharged: '',
          myCost: 0,
          commType: 'PERCENT',
          commValue: 10,
          payoutAmount: 0
        });
        setSelectedCategory('');
        setSelectedSubCategory('');
        setActiveTab('dashboard');
      };

      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          if (authRole === 'PARTNER' && tx.shopId !== loggedInShopId) return false;
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return tx.customerName.toLowerCase().includes(q) || tx.description.toLowerCase().includes(q) || tx.phone.includes(q);
        });
      }, [transactions, authRole, loggedInShopId, searchQuery]);

      const totalAdminOwed = useMemo(() => transactions.filter(t => !t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0), [transactions]);
      const totalAdminNetProfit = useMemo(() => transactions.reduce((sum, t) => sum + (t.totalCharged - t.myCost - t.payoutToOther), 0), [transactions]);

      const partnerMetrics = useMemo(() => {
        const partnerTxs = transactions.filter(t => t.shopId === loggedInShopId);
        const pendingPayout = partnerTxs.filter(t => !t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0);
        const settledPayout = partnerTxs.filter(t => t.isSettled).reduce((sum, t) => sum + t.payoutToOther, 0);
        const completedCount = partnerTxs.filter(t => t.jobStatus === 'COMPLETED').length;
        return { pendingPayout, settledPayout, completedCount, totalCount: partnerTxs.length };
      }, [transactions, loggedInShopId]);

      if (authRole === 'GUEST_ADMIN' || authRole === 'GUEST_PARTNER') {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full relative">

            )}

            {/* SUB-CATEGORIES TAB (ADMIN) */}
            {activeTab === 'subCategories' && authRole === 'ADMIN' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border">
                  <h3 className="font-bold mb-4 text-gray-800">➕ {t.addSubCatTitle}</h3>
                  <form onSubmit={handleAddSubCategory} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.selectCategory}</label>
                      <select value={newSubCat.categoryId} onChange={(e) => setNewSubCat({...newSubCat, categoryId: e.target.value})} className="w-full border rounded-lg p-2 text-sm">
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.subCatNameLabel}</label>
                      <input type="text" required value={newSubCat.name} onChange={(e) => setNewSubCat({...newSubCat, name: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm">{t.subCatSaveBtn}</button>
                  </form>
                </div>
                <div className="bg-white p-6 rounded-xl shadow-sm border">
                  <h3 className="font-bold mb-4 text-gray-800">📂 Sub-Categories List</h3>
                  <div className="space-y-2">
                    {subCategories.map(sub => {
                      const parentCat = categories.find(c => c.id === sub.categoryId);
                      return (
                        <div key={sub.id} className="p-3 border rounded-lg bg-gray-50 flex justify-between items-center text-xs">
                          <div>
                            <span className="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold mr-1">{parentCat?.name}</span>
                            <div className="font-bold text-slate-800 text-sm mt-1">{sub.name}</div>
                          </div>
                          <button onClick={() => setSubCategories(subCategories.filter(x => x.id !== sub.id))} className="text-red-500 font-bold">🗑️</button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* SHOPS TAB (ADMIN) */}
            {activeTab === 'shops' && authRole === 'ADMIN' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-xl shadow-sm border">
                  <h3 className="font-bold mb-4 text-gray-800">🏬 {t.addNewsShop}</h3>
                  <form onSubmit={handleAddShop} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.shopName}</label>
                      <input type="text" required value={newShop.name} onChange={(e) => setNewShop({...newShop, name: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.contactPerson}</label>
                      <input type="text" value={newShop.contactPerson} onChange={(e) => setNewShop({...newShop, contactPerson: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.phone}</label>
                      <input type="text" value={newShop.phone} onChange={(e) => setNewShop({...newShop, phone: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">{t.defaultCommRate}</label>
                      <input type="number" value={newShop.defaultCommRate} onChange={(e) => setNewShop({...newShop, defaultCommRate: e.target.value})} className="w-full border rounded-lg p-2 text-sm" />
                    </div>
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm">{t.saveShopBtn}</button>
                  </form>
                </div>

                <div className="bg-white p-6 rounded-xl shadow-sm border">
                  <h3 className="font-bold mb-4 text-gray-800">🤝 Registered Partner Accounts</h3>
                  <div className="space-y-3">
                    {shops.map(s => (
                      <div key={s.id} className="p-3 border rounded-lg bg-slate-50 flex justify-between items-center text-xs">
                        <div>
                          <div className="font-bold text-slate-800 text-sm">{s.name}</div>
                          <div className="text-gray-500">Contact: {s.contactPerson} ({s.phone})</div>
                          <div className="text-gray-500 mt-1">User: <code className="bg-gray-200 px-1 rounded">{s.username}</code> | Pass: <code className="bg-gray-200 px-1 rounded">{s.password}</code></div>
                        </div>
                        <div className="text-amber-700 font-bold">Comm: {s.defaultCommRate}%</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
